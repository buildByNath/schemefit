<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchemeFit Extension</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="header">
                <h2>SchemeFit Autofill</h2>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button id="login-btn">Login to SchemeFit</button>
            <div id="error-msg" class="error"></div>
        </div>

        <!-- Profile Screen -->
        <div id="profile-screen" class="screen">
            <div class="header">
                <h2>SchemeFit Autofill</h2>
            </div>
            <div class="profile-card">
                <p>Status: <span class="status-active">Active</span></p>
                <h3 id="user-name">Loading...</h3>
                <p id="user-email" class="text-sm">...</p>
                <div class="badges">
                    <span id="user-caste" class="badge bg-blue"></span>
                    <span id="user-income" class="badge bg-green"></span>
                </div>
            </div>
            <p class="helper-text">Ready to autofill government forms!</p>
            <button id="logout-btn" class="btn-secondary">Logout</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
